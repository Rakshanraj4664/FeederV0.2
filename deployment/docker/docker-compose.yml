version: '3.8'

services:
  backend:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
      target: backend-build
    container_name: feeder-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      feeder-net:
        ipv4_address: 192.168.1.50

  frontend:
    image: nginx:alpine
    container_name: feeder-frontend
    ports:
      - "80:80"
    volumes:
      - ../../dist:/usr/share/nginx/html:ro
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      feeder-net:
        ipv4_address: 192.168.1.51

networks:
  feeder-net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.1.0/24
